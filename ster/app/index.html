<!-- Esto es lo que ve quien recibe una invitación por WhatsApp, así que
     las etiquetas sociales importan más aquí que en ninguna otra página:
     sin ellas el enlace sale como una línea de texto pelada. Los
     rastreadores que pintan la vista previa leen el HTML pero no
     ejecutan el script de abajo, así que la tarjeta sale aunque a las
     personas se las mande a su tienda. -->
<meta property="og:title" content="Ster · Cronómetro de estudio">
<meta property="og:description" content="Mide lo que estudias, no lo que crees.">
<meta property="og:type" content="website">

<!-- ── a qué tienda manda ───────────────────────────────────────────────
     Cada móvil a la suya. Las direcciones van SIN código de país y SIN
     el nombre de la app: el /us/ que da App Store Connect mandaría a un
     opositor español a la tienda de Estados Unidos, y el nombre en la
     ruta deja de valer el día que se renombre la app.

     `location.replace` y no `href`: con `href` esta página se queda en
     el historial, y al volver atrás desde la tienda el navegador la
     carga otra vez y te vuelve a expulsar.

     ⚠️  GOOGLE PLAY ESTÁ A `null` A PROPÓSITO. Mientras Ster esté solo
     en prueba cerrada, su ficha de Play no existe para el público y el
     enlace daría «no encontrado». Hasta entonces, Android va a la
     portada, que dice que llega pronto. El día que esté publicada, se
     pone la dirección aquí y todos los enlaces ya compartidos empiezan
     a funcionar solos. -->
<script>
(function () {
  var APP_STORE = 'https://apps.apple.com/app/id6812349526';
  var GOOGLE_PLAY = null; // 'https://play.google.com/store/apps/details?id=com.sterstudy.ster'
  var PORTADA = '../';

  var ua = navigator.userAgent || '';
  // Los iPad recientes se presentan como un Mac; lo que los delata es
  // la pantalla táctil.
  var ios = /iPhone|iPad|iPod/.test(ua) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var android = /Android/.test(ua);

  var destino = ios ? APP_STORE : android ? (GOOGLE_PLAY || PORTADA) : PORTADA;
  location.replace(destino);
})();
</script>
